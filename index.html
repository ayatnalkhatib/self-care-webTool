<!DOCTYPE html>
<html lang="en">
<head>
  <title>Self-care Web Tool</title>
  <meta charset="UTF-8">
  <meta name="description" content="Self-care Web tool">
  <meta name="author" content="Ayat Alkhatib">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="asset/css/style.css" rel="stylesheet">


</head>

<body>
  <main>
  <!--Login Section-->
    <section id="loginSection" class="web-tool">
      <div class="login-card">
        <h2>Login / Sign Up</h2>
        <input type="email" id="usernameInput" placeholder="Email" required>
        <input type="password" id="passwordInput" placeholder="Password" required>
        
        <div class="buttons">
          <button onclick="login()">Login</button>
          <button onclick="signup()">Sign Up</button>
        </div>
        <p id="loginMessage"></p>
      </div>
    </section>

  <!--New User Section-->
    <section id="newUser" class="web-tool">
      <section id="userNamegen">
        <p>Welcome to Self-Care Tracker</p>
        <p>Let's Began:</p>
        <p>Nickname:</p><input type="text" id="nickname" placeholder="Nickname" required>
        <p>Choose Your Avatar:</p>
        <div class="characters">
          <div class="female"></div>
          <div class="male"></div>
        </div>
      </section>
      <!--<section id="avatarcust">
      </section>-->

      <div class="topBar">
        <button onclick="logout()">Logout</button>
      </div>
    </section>
  
  <!--Main Page-->
    <section id="mainPage" class="web-tool">
      <div class="message"></div>
      <section class="dashboard">

        <!-- LEFT SIDE -->
        <div class="leftPanel">
          <img id="avatar" src="asset/img/avatarwomen.png" />
        </div>

        <!-- RIGHT SIDE -->
        <div class="rightPanel">

        <ul>
          <li><a href="#" onclick="showSection('wellnessTracker'); return false;">Wellness Tracker</a></li>
          <li><a href="#" onclick="showSection('journal'); return false;">Journal</a></li>
          <li><a href="#" onclick="showSection('report'); return false;">Report</a></li>
          <li><a href="#" onclick="showSection('calander'); return false;">Calander</a></li>
        </ul>

          <div class="topBar">
            <button onclick="logout()">Logout</button>
          </div>

        </div>

      </section>
    </div>
      </div>
      

   
    </section>

  <!--Wellness Tracker-->
    <section id="wellnessTracker" class="web-tool">

  <div class="wellness">
    <h3>Wellness Tracker</h3>

    <label>Water Intake</label>
    <input type="text" id="waterintake">

    <label>Exercise</label>
    <input type="text" id="exercise">

    <label>Sleep</label>
    <input type="text" id="sleep">

    <label>Calories Intake</label>
    <input type="text" id="cal-intake">
  </div>

  <div class="mind">
    <h3>Mind Tracker</h3>

    <label>30-Minute Reading</label>
    <div class="radio-group">
      <input type="radio" id="yes" name="reading" value="yes">
      <label for="yes">Yes</label>

      <input type="radio" id="no" name="reading" value="no">
      <label for="no">No</label>
    </div>

    <label>Hobby</label>
    <input type="text" id="hobby">

    <h5>Mood Tracker</h5>
    <ul class="mood-list">
      <li>😊 Happy</li>
      <li>😐 Okay</li>
      <li>😢 Sad</li>
    </ul>
  </div>

</section>

<div class="wellness-buttons">
  <button class="backToMain">Back</button>
  <button class="savedata">Insert</button>
</div>

<div class="self-care"></div>
  <!--Journal-->
    <section id="journal" class="web-tool"></section>

  <!--Report-->
    <section id="report" class="web-tool"></section>

  <!--Calander-->
    <section id="calander" class="web-tool"></section>
  </main>

<script type="module" src="asset/js/script.js"></script>
</body>
