<!DOCTYPE html>
<html lang="en">
<head>
  <title>Self-care Web Tool</title>
  <meta charset="UTF-8">
  <meta name="description" content="Self-care Web tool">
  <meta name="author" content="Ayat Alkhatib">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="asset/css/style.css" rel="stylesheet">
</head>

<body>
<main>

<!-- login section -->
<section id="loginSection" class="web-tool">
  <div class="login-card">
    <h2>Login / Sign Up</h2>

    <input type="email" id="usernameInput" placeholder="Email" required>
    <input type="password" id="passwordInput" placeholder="Password" required>

    <div class="buttons">
      <button onclick="login()">Login</button>
      <button onclick="signup()">Sign Up</button>
    </div>

    <p id="loginMessage"></p>
  </div>
</section>

<!-- new user section -->
<section id="newUser" class="web-tool">

  <section id="userNamegen">

    <p>Welcome to Self-Care Tracker</p>
    <p>What’s your name?</p>

    <input type="text" id="nickname" placeholder="Enter your name">

    <p>Choose Your Animal:</p>

    <div class="animal-grid">

      <div class="animal" data-animal="bear">🐻</div>
      <div class="animal" data-animal="cat">🐱</div>
      <div class="animal" data-animal="dog">🐶</div>
      <div class="animal" data-animal="rabbit">🐰</div>
      <div class="animal" data-animal="fox">🦊</div>
      <div class="animal" data-animal="panda">🐼</div>
      <div class="animal" data-animal="frog">🐸</div>
      <div class="animal" data-animal="koala">🐨</div>
      <div class="animal" data-animal="lion">🦁</div>
      <div class="animal" data-animal="pig">🐷</div>

    </div>

    <button onclick="createUser()">Continue</button>

  </section>

  <div class="topBar">
    <button onclick="logout()">Logout</button>
  </div>

</section>

<!-- main page -->
<section id="mainPage" class="web-tool">

  <div class="message"></div>

  <section class="dashboard">

    <!-- LEFT -->
    <div class="leftPanel">
      <div id="bearDisplay" class="animalDisplay"></div>
    </div>

    <!-- RIGHT -->
    <div class="rightPanel">

      <ul>
        <li><a href="#" onclick="showSection('wellnessTracker'); return false;">Wellness Tracker</a></li>
        <li><a href="#" onclick="showSection('journal'); return false;">Journal</a></li>
        <li><a href="#" onclick="showSection('report'); return false;">Report</a></li>
        <li><a href="#" onclick="showSection('calander'); return false;">Calendar</a></li>
      </ul>

      <div class="topBar">
        <button onclick="logout()">Logout</button>
      </div>

    </div>

  </section>
</section>

<!--wellness page-->
<section id="wellnessTracker" class="web-tool">

  <div class="wellness">
    <h3>Wellness Tracker</h3>

    <label>Water Intake</label>
    <input type="text" id="waterintake" placeholder="Enter number">

    <label>Exercise</label>
    <input type="text" id="exercise" placeholder="Enter number">

    <label>Sleep</label>
    <input type="text" id="sleep" placeholder="Enter number">

    <label>Calories Intake</label>
    <input type="text" id="cal-intake" placeholder="Enter number">
  </div>

  <div class="mind">
    <h3>Mind Tracker</h3>

    <label>30-Minute Reading</label>

    <div class="radio-group">
      <input type="radio" id="yes" name="reading" value="yes">
      <label for="yes">Yes</label>

      <input type="radio" id="no" name="reading" value="no">
      <label for="no">No</label>
    </div>

    <label>Hobby</label>
    <input type="text" id="hobby">

    <h5>Mood Tracker</h5>
    <ul class="mood-list">
      <li>😊 Happy</li>
      <li>😐 Okay</li>
      <li>😢 Sad</li>
    </ul>

  </div>

  <div class="wellness-buttons">
    <button class="backToMain">Back</button>
    <button class="savedata">Insert</button>
  </div>

</section>

<!-- jorunal -->
<section id="journal" class="web-tool">

  <div class="journal-box">
    <h2>My Journal</h2>

    <textarea id="journalInput" placeholder="Write your thoughts..."></textarea>

    <button onclick="saveJournal()">Save</button>

    <div id="journalEntries"></div>
  </div>

  <div class="wellness-buttons">
    <button class="backToMain">Back</button>
  </div>

</section>

<!-- report -->
<section id="report" class="web-tool"></section>

<!-- calander -->
<section id="calander" class="web-tool"></section>

</main>

</body>
</html>
